name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GitHub stats cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profile

          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github-readme-stats.vercel.app/api?username=Jhonmacc&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true" \
            --output profile/stats.svg

          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Jhonmacc&layout=compact&theme=tokyonight&hide_border=true" \
            --output profile/top-langs.svg

          grep -q '<svg' profile/stats.svg
          grep -q '<svg' profile/top-langs.svg

      - name: Commit updated cards
        shell: bash
        run: |
          if git diff --quiet -- profile/stats.svg profile/top-langs.svg && \
             git ls-files --error-unmatch profile/stats.svg profile/top-langs.svg >/dev/null 2>&1; then
            echo "No stats changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "chore: update GitHub profile stats"
          git push
